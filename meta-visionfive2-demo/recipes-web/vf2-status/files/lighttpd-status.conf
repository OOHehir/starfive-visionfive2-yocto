# Luckfox Pico status webserver — CGI config
server.modules += ("mod_cgi")
cgi.assign = (".cgi" => "")
index-file.names += ("status.cgi")
# Keep-alive idle must exceed the status page 5s meta-refresh, or reused
# connections race lighttpd's close and libsoup errors ("Connection
# terminated unexpectedly") instead of retrying.
server.max-keep-alive-idle = 30

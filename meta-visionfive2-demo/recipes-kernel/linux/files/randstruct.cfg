# Disable GCC-plugin RANDSTRUCT (randomized kernel struct layout).
#
# The vendor defconfig sets CONFIG_COMPILE_TEST=y, which flips the
# security/Kconfig.hardening RANDSTRUCT choice default from NONE to FULL
# (default RANDSTRUCT_FULL if COMPILE_TEST && GCC_PLUGINS). Nothing sets it
# explicitly — it rides in on the COMPILE_TEST default.
#
# RANDSTRUCT randomizes the layout of kernel structs at compile time. The
# closed, out-of-tree Imagination PowerVR DDK (pvrsrvkm) is compiled against a
# fixed struct layout and is highly sensitive to a seed/layout mismatch: with
# RANDSTRUCT on, pvrsrvkm reads a bogus address range on init and
# ccache_flush_range() spins forever (kernel soft-lock at GPU bring-up). The
# StarFive official image ships the vendor defconfig without the yocto security
# fragments, so it never hits this. Sibling board linux-milkv-megrez-dev pins
# RANDSTRUCT_NONE for the same reason.
#
# Pinning NONE here overrides the choice default. See docs/GPU_VERIFY.md and the
# JOURNAL "GPU root-cause" entry.
CONFIG_RANDSTRUCT_NONE=y

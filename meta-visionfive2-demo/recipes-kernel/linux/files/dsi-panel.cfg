# MIPI-DSI panel (10.1-DSI-TOUCH-A: ILI9881C 800x1280) + GT9271 touch.
#
# The StarFive DSI host (drivers/gpu/drm/verisilicon/starfive_drm_dsi.c,
# CONFIG_STARFIVE_DSI) registers a mipi_dsi_host, so a `panel@0` DSI child
# node under &mipi_dsi is instantiated as a mipi_dsi_device and bound by the
# MAINLINE ilitek ILI9881C driver via of_drm_find_panel() — no StarFive-
# specific panel driver needed. See docs/DSI_TOUCH.md.
#
# The following are already =y in the vendor defconfig and only listed here as
# documentation of the dependency (a fragment can't "un-set" them):
#   CONFIG_DRM_VERISILICON=y      -- dc8200 display controller (KMS)
#   CONFIG_STARFIVE_DSI=y         -- Cadence DSI host on the JH7110
#   CONFIG_DRM_MIPI_DSI=y
#   CONFIG_DRM_PANEL_SIMPLE=y
#   CONFIG_TOUCHSCREEN_GOODIX=y   -- GT9271/GT911 (I2C), already built in
#   CONFIG_BACKLIGHT_CLASS_DEVICE=y
#
# The one gap in the vendor defconfig — the ILI9881C panel driver:
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_ILITEK_ILI9881C=y

# Input plumbing so touch events reach userspace / evtest.
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_TOUCHSCREEN=y

# Backlight MCU on the 10.1-DSI-TOUCH-A (I2C 0x45) — out-of-tree waveshare
# driver added by 0002-waveshare-backlight.patch.
CONFIG_BACKLIGHT_WAVESHARE=y
